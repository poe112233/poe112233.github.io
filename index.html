<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>poe112233</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #0f0f0f;
            color: #e4e4e7;
            padding: 2rem;
        }
        .card {
            max-width: 480px;
            text-align: center;
            padding: 3rem 2rem;
            background: #18181b;
            border: 1px solid #27272a;
            border-radius: 12px;
        }
        .avatar {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            background: linear-gradient(135deg, #3b82f6, #8b5cf6);
            margin: 0 auto 1.5rem;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2rem;
            font-weight: 700;
            color: #fff;
        }
        h1 {
            font-size: 1.75rem;
            font-weight: 600;
            margin-bottom: 0.5rem;
        }
        p {
            color: #a1a1aa;
            font-size: 1rem;
            line-height: 1.6;
            margin-bottom: 1.5rem;
        }
        a {
            color: #3b82f6;
            text-decoration: none;
            font-size: 0.9rem;
        }
        a:hover { text-decoration: underline; }
        .footer {
            margin-top: 2rem;
            font-size: 0.8rem;
            color: #52525b;
        }
    </style>
</head>
<body>
    <div class="card">
        <div class="avatar">P</div>
        <h1>Hi, I'm poe112233</h1>
        <p>这是我的个人网站，托管在 GitHub Pages 上。<br>后续会在这里分享我的项目、笔记和技术内容。</p>
        <a href="https://github.com/poe112233">GitHub Profile</a>
        <div class="footer">Built with GitHub Pages</div>
    </div>
</body>
</html>
